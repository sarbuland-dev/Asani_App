name: clinic_web
description: "Asani clinic web: clinic dashboard and super admin (Flutter Web)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  asani_core:
    path: ../../packages/asani_core
  asani_ui:
    path: ../../packages/asani_ui
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  google_fonts: ^8.2.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.2
  web: ^1.1.1
  qr: ^3.0.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
